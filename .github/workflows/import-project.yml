name: Import project snapshot
on:
  push:
    paths:
      - project-source-part-1.zip
      - project-source-part-2.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Verify and unpack the prepared source
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path, PurePosixPath
          import zipfile, hashlib
          expected = {'project-source-part-1.zip': 'ea8dae10c6da6642143e7442b4fd5056196f94bd0d09bf87a5f1bc2e16a566c3', 'project-source-part-2.zip': '9abc356e1d738acdca6d63bd41fedbd5261eff0bdb81d2bc23aebaaccb3a1a4e'}
          if not all(Path(n).is_file() for n in expected):
              raise SystemExit('Both prepared source parts are required')
          count = 0
          for name, digest in expected.items():
              data = Path(name).read_bytes()
              assert hashlib.sha256(data).hexdigest() == digest, name
              with zipfile.ZipFile(name) as archive:
                  assert archive.testzip() is None
                  for entry in archive.infolist():
                      parts = PurePosixPath(entry.filename).parts
                      assert parts[0] == 'semantic-incremental-gaussians'
                      assert len(parts) > 1 and '..' not in parts
                      assert parts[1] not in ('.git', '.github')
                      target = Path(*parts[1:])
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(entry))
                      target.chmod(0o755 if (entry.external_attr >> 16) & 0o111 else 0o644)
                      count += 1
          assert count == 1785, count
          print('Verified and imported', count, 'source, documentation and evidence files')
          PYCODE
      - name: Commit the complete project tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f project-source-part-1.zip project-source-part-2.zip
          git add -A
          git commit -m 'Import complete Gaussian reconstruction project with separate Chinese and English READMEs'
          git push origin HEAD:main
