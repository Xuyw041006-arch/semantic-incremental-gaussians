[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-semantic-gaussians"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "pillow", "scipy", "av", "pycolmap==3.13.0"]

[project.optional-dependencies]
train = ["torch", "gsplat==1.5.3", "scikit-image", "open_clip_torch"]

[project.scripts]
videogs = "videogs.__main__:main"

[tool.setuptools.packages.find]
include = ["videogs*", "hglab*"]

[tool.setuptools.package-data]
videogs = ["viewer.html"]
